# Serves the CP Portal SPA and proxies /api to the backend on the SAME ORIGIN.
#
# Why a proxy rather than two separate hosts: the frontend calls the API with
# relative paths (`fetch('/api/admin/auth/login')`) and has no API-base helper,
# so the API must appear on the same origin as the app. Splitting static hosting
# from the API would break every call.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Cloud Run terminates TLS and forwards to :8080. nginx builds absolute
  # redirects from its own listen port, so `/` redirected to
  # http://<host>:8080/cp-portal/ - wrong scheme, and it leaks the container
  # port. Relative redirects let the browser keep https and the real port.
  absolute_redirect off;

  # Cloud Run's DNS. Needed because the upstream is an https:// name resolved at
  # request time, not at config-load time.
  resolver 169.254.169.254 valid=30s ipv6=off;

  location /api/ {
    set $upstream "BACKEND_URL_PLACEHOLDER";
    proxy_pass $upstream$request_uri;
    proxy_ssl_server_name on;
    proxy_set_header Host BACKEND_HOST_PLACEHOLDER;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
  }

  # Vite builds with base '/cp-portal/', so assets are requested under that path.
  location /cp-portal/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /index.html;
  }

  location = / {
    return 302 /cp-portal/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
