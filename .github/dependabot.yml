version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/mims"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "mims"]

  - package-ecosystem: "npm"
    directory: "/apps/mims/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "mims", "frontend"]

