version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/mims"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "app:mims"]

  - package-ecosystem: "npm"
    directory: "/apps/mims/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "app:mims", "frontend"]

  - package-ecosystem: "npm"
