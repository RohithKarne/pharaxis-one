version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/mims"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One PR per directory instead of one per package. Without this, every PR
      # touches the same package-lock.json as its siblings, so merging any one
      # conflicts the rest - 61 of 67 open PRs were CONFLICTING on 2026-08-08.
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    labels: ["dependencies", "app:mims"]

