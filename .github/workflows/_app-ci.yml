name: Reusable App CI

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_root:
        required: true
        type: string
      app_lockfile:
        required: true
        type: string
      frontend_dir:
        required: true
        type: string
      frontend_lockfile:
        required: true
        type: string
      backend_working_directory:
        required: true
        type: string
      backend_entrypoint:
        required: true
        type: string
      quality_command:
        required: false
        default: ''
        type: string
      security_command:
        required: false
        default: ''
        type: string
      # Set to the app's test database name to spin up MySQL and run unit
      # tests. Without it the app is only built and syntax-checked, which is
      # what every app did before 2026-07-27 — a green tick meant "it
      # compiled", not "it works".
      test_database:
        required: false
        default: ''
        type: string
      test_command:
        required: false
        default: 'npm test'
        type: string

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.frontend_dir }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ inputs.frontend_lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-syntax:
    name: Backend Syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.backend_working_directory }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Syntax check backend entrypoint
        run: node --check ${{ inputs.backend_entrypoint }}

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: ${{ inputs.quality_command != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.app_root }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ inputs.app_lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Install scanner dependencies
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run quality gate
        run: ${{ inputs.quality_command }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: ${{ inputs.security_command != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.app_root }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ inputs.app_lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Install scanner dependencies
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run security scan
        run: ${{ inputs.security_command }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Only runs when the caller provides a test database. Apps without one are
    # still built and syntax-checked, but their tests do not gate the build.
    if: ${{ inputs.test_database != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.app_root }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: ${{ inputs.test_database }}
          MYSQL_USER: devuser
          MYSQL_PASSWORD: devpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -udevuser -pdevpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
      MYSQL_DATABASE: ${{ inputs.test_database }}
      NODE_ENV: test
      JWT_SECRET: ci_test_secret_not_used_outside_ci
      BOOTSTRAP_PLATFORM_ADMIN_EMAIL: platform_admin
      BOOTSTRAP_PLATFORM_ADMIN_PASSWORD: Test@1234

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ inputs.app_lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -udevuser -pdevpass --silent 2>/dev/null; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL never became ready"; exit 1

      # QMS migration 0001 installs two triggers that make qms_audit_events
      # append-only — the audit-trail immutability control. MySQL refuses to
      # create a trigger when binary logging is on and the connecting user lacks
      # SUPER, which devuser does:
      #
      #   ER_BINLOG_CREATE_ROUTINE_NEED_SUPER
      #
      # Set here as root so the control is actually installed and exercised,
      # rather than skipping the migration and testing a schema without it.
      #
      # NOTE FOR DEPLOYMENT, not CI: this means QMS cannot install its audit
      # triggers on a managed MySQL that withholds SUPER (RDS, Cloud SQL, Azure
      # Database) unless log_bin_trust_function_creators is set at the server
      # level. If it is not, migration 0001 fails — and forcing past it would
      # leave the audit ledger mutable. Raised with Vasu 2026-08-06.
      - name: Allow trigger creation without SUPER
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pdevpass \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Run unit tests
        run: ${{ inputs.test_command }}
