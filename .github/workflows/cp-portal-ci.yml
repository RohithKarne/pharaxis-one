name: CP Portal CI

# Runs on changes to the CP Portal app. Sits ready until git push is re-enabled.
on:
  push:
    paths: ['apps/cp-portal/**', '.github/workflows/cp-portal-ci.yml']
  pull_request:
    paths: ['apps/cp-portal/**']

jobs:
  backend:
    name: Backend — syntax & smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cp-portal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Static syntax check
        run: npm run test:static
      # Smoke tests need a MySQL service — enable once the CI DB is provisioned:
      # - run: npm run test:smoke

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cp-portal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
