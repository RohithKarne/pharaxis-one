name: MIMS Validated Release

on:
  push:
    tags:
      - 'mims-v*.*.*'

jobs:
  validated-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mims
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - run: cd frontend && npm ci
      - run: npm test -- --runInBand
      - run: node backend/scripts/verify-audit-completeness.js
      - run: node backend/scripts/build-traceability.js
      - run: npm audit --audit-level=high
      - run: cd frontend && npm run build
      - run: zip -r validation-bundle.zip validation compliance backend/scripts/verify-audit-completeness.js
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json || true
      - run: sha256sum validation-bundle.zip sbom.json > release-manifest.sha256
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            apps/mims/validation-bundle.zip
            apps/mims/sbom.json
            apps/mims/release-manifest.sha256
