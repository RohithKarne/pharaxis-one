name: MIMS CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mims/**'
      - '.github/workflows/_app-ci.yml'
      - '.github/workflows/ci-mims.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mims/**'
      - '.github/workflows/_app-ci.yml'
      - '.github/workflows/ci-mims.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_app-ci.yml
    with:
      app_name: MIMS
      app_root: apps/mims
      app_lockfile: apps/mims/package-lock.json
      frontend_dir: apps/mims/frontend
      frontend_lockfile: apps/mims/frontend/package-lock.json
      backend_working_directory: apps/mims
      backend_entrypoint: backend/server.js
      # MIMS was the only app with no quality gate. Worse than absent: the shared
      # workflow guards this job with `if: quality_command != ''`, so it SKIPPED —
      # and a skipped check reports as a pass. See SOP 38.7.
      quality_command: npm run test:static
      security_command: npm run security:scan
      # 73 backend unit tests now gate the build. Before this, CI only built the
      # frontend and syntax-checked the backend entrypoint — it never ran a test.
      test_database: pharaxis_mims_test
      test_command: npm test
