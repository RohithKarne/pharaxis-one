name: Deploy MIMS

on:
  push:
    branches: [main]
    paths:
      - 'apps/mims/**'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_app-deploy.yml
    secrets: inherit
    with:
      app_name: MIMS
      app_slug: mims
      app_root: apps/mims
      frontend_dir: apps/mims/frontend
      frontend_lockfile: apps/mims/frontend/package-lock.json
      publish_dir: /var/www/pharaxis/mims
      pm2_name: mims
      environment_name: mims-prod
