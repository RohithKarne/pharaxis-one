name: MIMS Remote Deploy Disabled

on:
  workflow_dispatch:

jobs:
  local-only-status:
    uses: ./.github/workflows/_app-deploy.yml
    secrets: inherit
    with:
      app_name: MIMS
      app_slug: mims
      app_root: apps/mims
      frontend_dir: apps/mims/frontend
      frontend_lockfile: apps/mims/frontend/package-lock.json
      publish_dir: local-only-disabled
      pm2_name: local-only-disabled
      environment_name: local-only-disabled
