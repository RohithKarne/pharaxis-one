name: Reusable App Deploy

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_slug:
        required: true
        type: string
      app_root:
        required: true
        type: string
      frontend_dir:
        required: true
        type: string
      frontend_lockfile:
        required: true
        type: string
      publish_dir:
        required: true
        type: string
      pm2_name:
        required: true
        type: string
      environment_name:
        required: true
        type: string

jobs:
  local-only:
    name: Remote deploy retired
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain local-only availability
        run: |
          echo "Remote deployment for ${{ inputs.app_name }} is disabled."
          echo "The AWS/EC2 Pharaxis host was deleted, so GitHub Actions must not SSH, SCP, publish to /var/www, pull on a server, or restart PM2."
          echo "Use the app CI workflows for GitHub validation and run Pharaxis apps locally for runtime checks."
          exit 1
