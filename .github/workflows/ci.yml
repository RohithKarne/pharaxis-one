name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-builds:
    name: Frontend Build - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Vault
            working_directory: apps/vault/frontend
            lockfile: apps/vault/frontend/package-lock.json
          - app: QMS
            working_directory: apps/qms/frontend
            lockfile: apps/qms/frontend/package-lock.json
          - app: CP Portal
            working_directory: apps/cp-portal/frontend
            lockfile: apps/cp-portal/frontend/package-lock.json
          - app: MIMS
            working_directory: apps/mims/frontend
            lockfile: apps/mims/frontend/package-lock.json
          - app: AI Agent
            working_directory: apps/ai-agent/frontend
            lockfile: apps/ai-agent/frontend/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-syntax:
    name: Backend Syntax - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Vault
            working_directory: apps/vault
            entrypoint: backend/server.js
          - app: QMS
            working_directory: apps/qms/backend
            entrypoint: server.js
          - app: CP Portal
            working_directory: apps/cp-portal/backend
            entrypoint: server.js
          - app: MIMS
            working_directory: apps/mims
            entrypoint: backend/server.js
          - app: AI Agent
            working_directory: apps/ai-agent
            entrypoint: backend/server.js
    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Syntax check backend entrypoint
        run: node --check ${{ matrix.entrypoint }}

  mims-security:
    name: MIMS Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mims
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mims/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security scan
        run: npm run security:scan

  app-quality-gates:
    name: App Quality Gates - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: CP Portal
            working_directory: apps/cp-portal
            lockfile: apps/cp-portal/package-lock.json
          - app: QMS
            working_directory: apps/qms
            lockfile: apps/qms/package-lock.json
          - app: Vault
            working_directory: apps/vault
            lockfile: apps/vault/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Install scanner dependencies
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run static backend checks
        run: npm run test:static

      - name: Run security scan
        run: npm run security:scan
