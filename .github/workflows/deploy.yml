name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  detect:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      mims:         ${{ steps.changes.outputs.mims }}
      cp_portal:    ${{ steps.changes.outputs.cp_portal }}
      ieg:          ${{ steps.changes.outputs.ieg }}
      publications: ${{ steps.changes.outputs.publications }}
      safety:       ${{ steps.changes.outputs.safety }}
      vault:        ${{ steps.changes.outputs.vault }}
      ai_agent:     ${{ steps.changes.outputs.ai_agent }}
      qms:          ${{ steps.changes.outputs.qms }}
      backend:      ${{ steps.changes.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect which apps changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          flag() { echo "$CHANGED" | grep -q "^$1" && echo "true" || echo "false"; }

          echo "mims=$(flag 'apps/medical-affairs/mims')"                   >> $GITHUB_OUTPUT
          echo "cp_portal=$(flag 'apps/medical-affairs/cp-portal')"         >> $GITHUB_OUTPUT
          echo "ieg=$(flag 'apps/medical-affairs/ieg')"                     >> $GITHUB_OUTPUT
          echo "publications=$(flag 'apps/medical-affairs/publications')"   >> $GITHUB_OUTPUT
          echo "safety=$(flag 'apps/safety')"                               >> $GITHUB_OUTPUT
          echo "vault=$(flag 'apps/vault')"                                 >> $GITHUB_OUTPUT
          echo "ai_agent=$(flag 'apps/ai-agent')"                           >> $GITHUB_OUTPUT
          echo "qms=$(flag 'apps/qms')"                                     >> $GITHUB_OUTPUT

          BACKEND=$(echo "$CHANGED" | grep -qE '^apps/.*/backend' && echo "true" || echo "false")
          echo "backend=$BACKEND"                                            >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────
  # BUILD PHASE — runs on GitHub runner (7GB RAM, 2 CPU, fast)
  # Only changed apps are built. Each job is independent and runs in parallel.
  # ─────────────────────────────────────────────────────────────────────────

  build-mims:
    name: Build MIMS
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.mims == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/medical-affairs/mims/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/medical-affairs/mims/frontend
      - run: npm run build
        working-directory: apps/medical-affairs/mims/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mims
          path: apps/medical-affairs/mims/frontend/dist/
          retention-days: 1

  build-cp-portal:
    name: Build CP Portal
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.cp_portal == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/medical-affairs/cp-portal/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/medical-affairs/cp-portal/frontend
      - run: npm run build
        working-directory: apps/medical-affairs/cp-portal/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cp-portal
          path: apps/medical-affairs/cp-portal/frontend/dist/
          retention-days: 1

  build-ieg:
    name: Build IEG
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.ieg == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/medical-affairs/ieg/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/medical-affairs/ieg/frontend
      - run: npm run build
        working-directory: apps/medical-affairs/ieg/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ieg
          path: apps/medical-affairs/ieg/frontend/dist/
          retention-days: 1

  build-publications:
    name: Build Publications
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.publications == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/medical-affairs/publications/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/medical-affairs/publications/frontend
      - run: npm run build
        working-directory: apps/medical-affairs/publications/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dist-publications
          path: apps/medical-affairs/publications/frontend/dist/
          retention-days: 1

  build-safety:
    name: Build Safety
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.safety == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/safety/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/safety/frontend
      - run: npm run build
        working-directory: apps/safety/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dist-safety
          path: apps/safety/frontend/dist/
          retention-days: 1

  build-vault:
    name: Build Vault
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.vault == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vault/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/vault/frontend
      - run: npm run build
        working-directory: apps/vault/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dist-vault
          path: apps/vault/frontend/dist/
          retention-days: 1

  build-ai-agent:
    name: Build AI Agent
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.ai_agent == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ai-agent/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/ai-agent/frontend
      - run: npm run build
        working-directory: apps/ai-agent/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ai-agent
          path: apps/ai-agent/frontend/dist/
          retention-days: 1

  build-qms:
    name: Build QMS
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.qms == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/qms/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/qms/frontend
      - run: npm run build
        working-directory: apps/qms/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: dist-qms
          path: apps/qms/frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # DEPLOY PHASE — SSH to EC2, copy built dist/ files, restart PM2 if needed
  # EC2 never runs npm install or npm run build.
  # ─────────────────────────────────────────────────────────────────────────

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - detect
      - build-mims
      - build-cp-portal
      - build-ieg
      - build-publications
      - build-safety
      - build-vault
      - build-ai-agent
      - build-qms
    # Run deploy even if some build jobs were skipped (app unchanged)
    if: always() && !cancelled() && !failure()
    timeout-minutes: 15

    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/pharaxis-key.pem
          sed -i 's/\r$//' ~/.ssh/pharaxis-key.pem
          chmod 600 ~/.ssh/pharaxis-key.pem

      - name: Preflight EC2 SSH reachability
        run: |
          HOST="${{ secrets.EC2_HOST }}"
          PORT="${{ secrets.EC2_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT="22"; fi

          echo "Checking SSH reachability to ${HOST}:${PORT}"
          for i in {1..6}; do
            if nc -z -w 5 "$HOST" "$PORT"; then
              echo "SSH port is reachable."
              exit 0
            fi
            echo "Attempt $i/6 failed. Retrying in 10s..."
            sleep 10
          done

          echo "ERROR: Cannot reach ${HOST}:${PORT} from GitHub runner."
          echo "Check EC2 instance state, EC2_HOST secret, security-group inbound rule for SSH, and NACL."
          exit 1

      - name: Copy dist files to EC2 staging dir
        run: |
          MIMS="${{ needs.detect.outputs.mims }}"
          CP_PORTAL="${{ needs.detect.outputs.cp_portal }}"
          IEG="${{ needs.detect.outputs.ieg }}"
          PUBLICATIONS="${{ needs.detect.outputs.publications }}"
          SAFETY="${{ needs.detect.outputs.safety }}"
          VAULT="${{ needs.detect.outputs.vault }}"
          AI_AGENT="${{ needs.detect.outputs.ai_agent }}"
          QMS="${{ needs.detect.outputs.qms }}"
          PORT="${{ secrets.EC2_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT="22"; fi

          DEST="${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"

          run_ssh() {
            ssh -i ~/.ssh/pharaxis-key.pem \
              -p "$PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "$DEST" "$@"
          }

          run_scp() {
            scp -i ~/.ssh/pharaxis-key.pem \
              -P "$PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              -r "$@"
          }

          retry() {
            local max=4
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "Command failed after ${max} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max} failed. Retrying in 8s..."
              attempt=$((attempt + 1))
              sleep 8
            done
          }

          # Create staging dirs on EC2 (ubuntu user owns /tmp)
          retry run_ssh "mkdir -p /tmp/pharaxis-dist/{mims,cp-portal,ieg,publications,safety,vault,ai-agent,qms}"

          if [ "$MIMS" = "true" ] && [ -d "artifacts/dist-mims" ]; then
            echo "--- Staging MIMS dist ---"
            retry run_scp artifacts/dist-mims/. "$DEST:/tmp/pharaxis-dist/mims/"
          fi

          if [ "$CP_PORTAL" = "true" ] && [ -d "artifacts/dist-cp-portal" ]; then
            echo "--- Staging CP Portal dist ---"
            retry run_scp artifacts/dist-cp-portal/. "$DEST:/tmp/pharaxis-dist/cp-portal/"
          fi

          if [ "$IEG" = "true" ] && [ -d "artifacts/dist-ieg" ]; then
            echo "--- Staging IEG dist ---"
            retry run_scp artifacts/dist-ieg/. "$DEST:/tmp/pharaxis-dist/ieg/"
          fi

          if [ "$PUBLICATIONS" = "true" ] && [ -d "artifacts/dist-publications" ]; then
            echo "--- Staging Publications dist ---"
            retry run_scp artifacts/dist-publications/. "$DEST:/tmp/pharaxis-dist/publications/"
          fi

          if [ "$SAFETY" = "true" ] && [ -d "artifacts/dist-safety" ]; then
            echo "--- Staging Safety dist ---"
            retry run_scp artifacts/dist-safety/. "$DEST:/tmp/pharaxis-dist/safety/"
          fi

          if [ "$VAULT" = "true" ] && [ -d "artifacts/dist-vault" ]; then
            echo "--- Staging Vault dist ---"
            retry run_scp artifacts/dist-vault/. "$DEST:/tmp/pharaxis-dist/vault/"
          fi

          if [ "$AI_AGENT" = "true" ] && [ -d "artifacts/dist-ai-agent" ]; then
            echo "--- Staging AI Agent dist ---"
            retry run_scp artifacts/dist-ai-agent/. "$DEST:/tmp/pharaxis-dist/ai-agent/"
          fi

          if [ "$QMS" = "true" ] && [ -d "artifacts/dist-qms" ]; then
            echo "--- Staging QMS dist ---"
            retry run_scp artifacts/dist-qms/. "$DEST:/tmp/pharaxis-dist/qms/"
          fi

      - name: Publish dist + pull backend + restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_SSH_PORT != '' && secrets.EC2_SSH_PORT || '22' }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e

            MIMS="${{ needs.detect.outputs.mims }}"
            CP_PORTAL="${{ needs.detect.outputs.cp_portal }}"
            IEG="${{ needs.detect.outputs.ieg }}"
            PUBLICATIONS="${{ needs.detect.outputs.publications }}"
            SAFETY="${{ needs.detect.outputs.safety }}"
            VAULT="${{ needs.detect.outputs.vault }}"
            AI_AGENT="${{ needs.detect.outputs.ai_agent }}"
            QMS="${{ needs.detect.outputs.qms }}"
            BACKEND="${{ needs.detect.outputs.backend }}"

            echo "======================================"
            echo " Pharaxis One — Publishing Built Apps"
            echo "======================================"

            # Move staged dist files to Nginx dirs (requires sudo)
            if [ "$MIMS" = "true" ]; then
              sudo cp -r /tmp/pharaxis-dist/mims/. /var/www/pharaxis/mims/
              echo "--- [MIMS] Published ✅ ---"
            fi
            if [ "$CP_PORTAL" = "true" ]; then
              sudo cp -r /tmp/pharaxis-dist/cp-portal/. /var/www/pharaxis/cp-portal/
              echo "--- [CP Portal] Published ✅ ---"
            fi
            if [ "$IEG" = "true" ]; then
              sudo cp -r /tmp/pharaxis-dist/ieg/. /var/www/pharaxis/ieg/
              echo "--- [IEG] Published ✅ ---"
            fi
            if [ "$PUBLICATIONS" = "true" ]; then
              sudo cp -r /tmp/pharaxis-dist/publications/. /var/www/pharaxis/publications/
              echo "--- [Publications] Published ✅ ---"
            fi
            if [ "$SAFETY" = "true" ]; then
              sudo cp -r /tmp/pharaxis-dist/safety/. /var/www/pharaxis/safety/
              echo "--- [Safety] Published ✅ ---"
            fi
            if [ "$VAULT" = "true" ]; then
              sudo cp -r /tmp/pharaxis-dist/vault/. /var/www/pharaxis/vault/
              echo "--- [Vault] Published ✅ ---"
            fi
            if [ "$AI_AGENT" = "true" ]; then
              sudo cp -r /tmp/pharaxis-dist/ai-agent/. /var/www/pharaxis/ai-agent/
              echo "--- [AI Agent] Published ✅ ---"
            fi
            if [ "$QMS" = "true" ]; then
              sudo cp -r /tmp/pharaxis-dist/qms/. /var/www/pharaxis/qms/
              echo "--- [QMS] Published ✅ ---"
            fi

            # Cleanup staging dir
            rm -rf /tmp/pharaxis-dist

            cd /home/ubuntu/pharaxis
            echo "--- Pulling latest code ---"
            git pull origin main

            echo "--- Applying PM2 ecosystem config ---"
            pm2 start ecosystem.config.js --update-env

            if [ "$BACKEND" = "true" ]; then
              echo "--- Backend changes detected — restarting PM2 ---"
              pm2 restart all
              echo "--- PM2 restarted ✅ ---"
            else
              echo "--- No backend changes — PM2 not restarted ---"
            fi

            pm2 save

            echo ""
            echo "======================================"
            echo " Deploy Complete ✅"
            echo "======================================"
