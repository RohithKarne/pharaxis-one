name: QMS CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/qms/**'
      - '.github/workflows/_app-ci.yml'
      - '.github/workflows/ci-qms.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/qms/**'
      - '.github/workflows/_app-ci.yml'
      - '.github/workflows/ci-qms.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_app-ci.yml
    with:
      app_name: QMS
      app_root: apps/qms
      app_lockfile: apps/qms/package-lock.json
      frontend_dir: apps/qms/frontend
      frontend_lockfile: apps/qms/frontend/package-lock.json
      backend_working_directory: apps/qms/backend
      backend_entrypoint: server.js
      quality_command: npm run test:static
      security_command: npm run security:scan
