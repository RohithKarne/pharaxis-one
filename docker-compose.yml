version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mims_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      # Note: MYSQL_DATABASE creates only one default DB; cp_portal_dev and mims_dev will be created via migration scripts
      MYSQL_DATABASE: mysql
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - mims_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mims_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: devuser
      PMA_PASSWORD: devpass
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - mims_network

volumes:
  mysql_data:

networks:
  mims_network:
    driver: bridge
